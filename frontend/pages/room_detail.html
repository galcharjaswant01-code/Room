<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details | StayHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .room-header { margin-top: var(--spacing-xl); margin-bottom: var(--spacing-lg); }
        .room-title { font-size: 2.5rem; margin-bottom: var(--spacing-xs); }
        .room-location { color: var(--color-text-muted); font-size: 1.1rem; }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: 200px 200px;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
            border-radius: var(--border-radius-lg);
            overflow: hidden;
        }
        .main-image { grid-row: 1 / 3; background: #eee; height: 100%; width: 100%; object-fit: cover; }
        .side-image { background: #e0e0e0; height: 100%; width: 100%; object-fit: cover; }

        .room-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: var(--spacing-2xl);
            margin-bottom: var(--spacing-2xl);
        }
        .room-info h3 { margin-top: var(--spacing-lg); margin-bottom: var(--spacing-sm); border-bottom: 1px solid var(--color-border); padding-bottom: var(--spacing-xs); }
        .facilities-list { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md); margin-bottom: var(--spacing-xl); }
        .facility-item { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; }
        .facility-item i { color: var(--color-accent); width: 20px; text-align: center; }
        
        .booking-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 100px;
        }
        .booking-price { font-size: 1.5rem; font-weight: 700; color: var(--color-primary); margin-bottom: var(--spacing-md); }
        .booking-price span { font-size: 1rem; font-weight: 400; color: var(--color-text-muted); }
        
        .map-container {
            height: 300px;
            background: #e5e7eb;
            border-radius: var(--border-radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-muted);
            margin-bottom: var(--spacing-xl);
        }
        
        /* Modal */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: var(--color-surface); padding: var(--spacing-xl);
            border-radius: var(--border-radius-lg); width: 100%; max-width: 500px;
        }
        .close-modal { float: right; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">StayHub<span class="logo-dot">.</span></a>
            <nav class="nav-links">
                <a href="../index.html">Home</a>
                <a href="search.html">Browse Rooms</a>
            </nav>
            <div class="nav-actions">
                <a href="auth.html" class="btn btn-outline">Login</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="room-content">
            <div class="loading-spinner" style="padding: 100px; text-align:center;">Loading room details...</div>
        </div>
    </main>

    <!-- Booking Modal -->
    <div id="booking-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeBookingModal()">&times;</span>
            <h2 id="modal-title">Complete Booking</h2>
            <div id="booking-step-1">
                <form id="booking-form">
                    <div class="form-group">
                        <label class="form-label">Check-in Date</label>
                        <input type="date" id="book-checkin" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Check-out Date</label>
                        <input type="date" id="book-checkout" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Total Amount: <span id="calc-total" style="font-weight: bold;">₹0</span></label>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%">Proceed to Payment</button>
                </form>
            </div>
            <div id="booking-step-2" style="display: none;">
                <h3 style="margin-bottom:15px; color:#10B981;"><i class="fas fa-lock"></i> Secure Demo Payment</h3>
                <p>This is a simulated payment gateway. No real money will be deducted.</p>
                <div class="form-group" style="margin-top: 15px;">
                    <label class="form-label">Card Details</label>
                    <input type="text" class="form-control" placeholder="**** **** **** 4242" disabled>
                </div>
                <button onclick="processMockPayment()" id="pay-btn" class="btn btn-primary" style="width: 100%">Pay <span id="pay-amount"></span></button>
            </div>
            <div id="booking-step-3" style="display: none; text-align: center;">
                <i class="fas fa-check-circle" style="font-size: 4rem; color: #10B981; margin-bottom: 20px;"></i>
                <h3>Booking Confirmed!</h3>
                <p>Your transaction was successful.</p>
                <a href="dashboard_tenant.html" class="btn btn-outline" style="margin-top: 15px;">View My Bookings</a>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/room.js"></script>
</body>
</html>
