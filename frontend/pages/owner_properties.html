<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Properties | StayHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #F3F4F6; }
        .dashboard-container { display: flex; min-height: calc(100vh - 73px); }
        .sidebar { width: 250px; background: var(--color-surface); border-right: 1px solid var(--color-border); padding: var(--spacing-xl) 0; }
        .sidebar-menu { display: flex; flex-direction: column; }
        .sidebar-link { padding: var(--spacing-sm) var(--spacing-xl); color: var(--color-text-muted); font-weight: 500; transition: all var(--transition-fast); display: flex; align-items: center; gap: 10px; }
        .sidebar-link:hover, .sidebar-link.active { background-color: #F9FAFB; color: var(--color-primary); border-right: 3px solid var(--color-accent); }
        .dashboard-main { flex: 1; padding: var(--spacing-2xl); overflow-y: auto; }
        
        .table-container { background: var(--color-surface); border-radius: var(--border-radius-md); border: 1px solid var(--color-border); overflow: hidden; box-shadow: var(--shadow-sm); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px; border-bottom: 1px solid var(--color-border); }
        th { background-color: #F9FAFB; font-weight: 600; color: var(--color-text-muted); font-size: 0.9rem; text-transform: uppercase; }
        .actions-col { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">StayHub<span class="logo-dot">.</span></a>
            <div class="nav-actions">
                <span class="user-greeting" id="user-greeting">Hi, Owner</span>
                <button onclick="api.logout()" class="btn btn-outline">Logout</button>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="dashboard_owner.html" class="sidebar-link"><i class="fas fa-chart-pie"></i> Dashboard</a>
                <a href="#" class="sidebar-link active"><i class="fas fa-home"></i> My Properties</a>
                <a href="owner_add_property.html" class="sidebar-link"><i class="fas fa-plus"></i> Add Property</a>
            </nav>
        </aside>

        <main class="dashboard-main container">
            <div class="section-header">
                <h2>My Properties</h2>
                <a href="owner_add_property.html" class="btn btn-primary"><i class="fas fa-plus"></i> Add New Property</a>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Property</th>
                            <th>Location</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="properties-tbody">
                        <tr><td colspan="5" style="text-align: center; padding: 30px;">Loading properties...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userStr = localStorage.getItem('user');
            if (!userStr) return window.location.href = 'auth.html';
            const user = JSON.parse(userStr);
            if (user.role !== 'owner') return window.location.href = '../index.html';
            
            document.getElementById('user-greeting').textContent = `Hi, ${user.first_name || user.username}`;

            const tbody = document.getElementById('properties-tbody');

            try {
                // Fetch all rooms (our API implicitly filters by is_active=True, but we want all for owner.
                // Wait, RoomViewSet defaults to is_active=True. As an owner, they might want to see inactive ones.
                // For simplicity, we just fetch rooms using the existing API.
                const rooms = await api.request('/properties/rooms/', 'GET');
                
                // Filter locally just to be sure we only see our rooms
                const myRooms = rooms.filter(r => r.owner === user.id);

                if (myRooms.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 30px;">No properties found.</td></tr>';
                    return;
                }

                tbody.innerHTML = myRooms.map(r => `
                    <tr>
                        <td style="font-weight: 500;">${r.title}</td>
                        <td>${r.location}</td>
                        <td>₹${r.price}/mo</td>
                        <td>
                            <span style="color: ${r.is_available ? 'green' : 'red'}; font-weight: 500; font-size: 0.9rem;">
                                ${r.is_available ? 'Available' : 'Booked'}
                            </span>
                        </td>
                        <td class="actions-col">
                            <a href="room_detail.html?id=${r.id}" class="btn btn-outline" style="padding: 4px 8px; font-size: 0.8rem;">View</a>
                            <button class="btn btn-outline" style="padding: 4px 8px; font-size: 0.8rem; border-color: red; color: red;" onclick="deleteRoom(${r.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');

            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 30px; color: red;">Failed to load properties.</td></tr>';
            }
        });

        async function deleteRoom(id) {
            if(confirm("Are you sure you want to deactivate/delete this room?")) {
                try {
                    await api.request(`/properties/rooms/${id}/`, 'DELETE');
                    window.location.reload();
                } catch(e) {
                    alert("Failed to delete.");
                }
            }
        }
    </script>
</body>
</html>
