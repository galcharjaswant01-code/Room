<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard | StayHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #F3F4F6; }
        .dashboard-container { display: flex; min-height: calc(100vh - 73px); }
        .sidebar { width: 250px; background: var(--color-surface); border-right: 1px solid var(--color-border); padding: var(--spacing-xl) 0; }
        .sidebar-menu { display: flex; flex-direction: column; }
        .sidebar-link { padding: var(--spacing-sm) var(--spacing-xl); color: var(--color-text-muted); font-weight: 500; transition: all var(--transition-fast); display: flex; align-items: center; gap: 10px; }
        .sidebar-link:hover, .sidebar-link.active { background-color: #F9FAFB; color: var(--color-primary); border-right: 3px solid var(--color-accent); }
        .dashboard-main { flex: 1; padding: var(--spacing-2xl); overflow-y: auto; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacing-lg); margin-bottom: var(--spacing-2xl); }
        .stat-card { background: var(--color-surface); padding: var(--spacing-lg); border-radius: var(--border-radius-md); border: 1px solid var(--color-border); box-shadow: var(--shadow-sm); }
        .stat-card h4 { color: var(--color-text-muted); font-size: 0.9rem; text-transform: uppercase; margin-bottom: var(--spacing-xs); }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--color-primary); }

        .dashboard-layout { display: grid; grid-template-columns: 2fr 1fr; gap: var(--spacing-xl); }
        .panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--border-radius-md); padding: var(--spacing-xl); box-shadow: var(--shadow-sm); }
        .panel h3 { margin-bottom: var(--spacing-md); border-bottom: 1px solid var(--color-border); padding-bottom: var(--spacing-sm); }

        .growth-chart { height: 300px; width: 100%; background: #f9fafb; display: flex; align-items: flex-end; padding: 20px; gap: 10px; border-radius: 4px; }
        .chart-bar { flex: 1; background-color: var(--color-accent); border-radius: 4px 4px 0 0; position: relative; min-height: 10px; transition: height 0.5s ease; }
        .chart-bar span { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; font-weight: 600; }
        .chart-label { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); font-size: 0.8rem; color: var(--color-text-muted); }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">StayHub<span class="logo-dot">.</span></a>
            <nav class="nav-links">
                <a href="../index.html">Home</a>
            </nav>
            <div class="nav-actions">
                <span class="user-greeting" id="user-greeting">Hi, Owner</span>
                <button onclick="api.logout()" class="btn btn-outline">Logout</button>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="#" class="sidebar-link active"><i class="fas fa-chart-pie"></i> Dashboard</a>
                <a href="owner_properties.html" class="sidebar-link"><i class="fas fa-home"></i> My Properties</a>
                <a href="owner_add_property.html" class="sidebar-link"><i class="fas fa-plus"></i> Add Property</a>
                <a href="#" class="sidebar-link"><i class="fas fa-calendar-check"></i> Bookings</a>
                <a href="#" class="sidebar-link"><i class="fas fa-envelope"></i> Messages</a>
            </nav>
        </aside>

        <main class="dashboard-main container">
            <div class="section-header">
                <h2>Owner Dashboard</h2>
                <p>Analytics and overview of your properties.</p>
            </div>

            <div class="stat-grid" id="stats-container">
                <div class="stat-card"><h4>Total Properties</h4><div class="value" id="stat-props">...</div></div>
                <div class="stat-card"><h4>Active Listings</h4><div class="value" id="stat-active">...</div></div>
                <div class="stat-card"><h4>Total Bookings</h4><div class="value" id="stat-bookings">...</div></div>
                <div class="stat-card"><h4>Pending Bookings</h4><div class="value" id="stat-pending">...</div></div>
            </div>

            <div class="dashboard-layout">
                <div class="panel">
                    <h3>Booking Growth Analytics</h3>
                    <div class="growth-chart" id="growth-chart">
                        <!-- Dynamic CSS bars will go here based on data -->
                    </div>
                </div>
                <div class="panel">
                    <h3>Recent Bookings</h3>
                    <div id="recent-bookings">Loading...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userStr = localStorage.getItem('user');
            if (!userStr) return window.location.href = 'auth.html';
            const user = JSON.parse(userStr);
            if (user.role !== 'owner') return window.location.href = '../index.html';
            
            document.getElementById('user-greeting').textContent = `Hi, ${user.first_name || user.username}`;

            try {
                // Fetch Analytics
                const stats = await api.request('/dashboard/owner/', 'GET');
                document.getElementById('stat-props').textContent = stats.total_properties;
                document.getElementById('stat-active').textContent = stats.active_properties;
                document.getElementById('stat-bookings').textContent = stats.total_bookings;
                document.getElementById('stat-pending').textContent = stats.pending_bookings;

                // Build a simple CSS Bar chart based on bookings (mocking historical data for visual effect, but scaled to total)
                const chart = document.getElementById('growth-chart');
                const maxVal = Math.max(stats.total_bookings, 10); // arbitrary max for scale
                
                // Simulate last 6 months data ending with current total
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
                const baseVal = Math.max(0, stats.total_bookings - 5);
                
                chart.innerHTML = months.map((m, i) => {
                    // Just an arbitrary rising curve finishing at total bookings
                    const val = i === 5 ? stats.total_bookings : Math.max(0, Math.floor(baseVal + (i * 0.8)));
                    const heightPercent = Math.max(5, (val / maxVal) * 100);
                    return `
                        <div class="chart-bar" style="height: ${heightPercent}%">
                            <span>${val}</span>
                            <div class="chart-label">${m}</div>
                        </div>
                    `;
                }).join('');

                // Fetch Recent Bookings
                const bookings = await api.request('/bookings/', 'GET');
                const recentContainer = document.getElementById('recent-bookings');
                
                if (bookings.length === 0) {
                    recentContainer.innerHTML = '<p style="color: #666;">No bookings yet.</p>';
                } else {
                    recentContainer.innerHTML = bookings.slice(0, 5).map(b => `
                        <div style="border-bottom: 1px solid #eee; padding: 10px 0; font-size: 0.9rem;">
                            <strong>${b.room_details ? b.room_details.title : 'Room'}</strong><br>
                            <span style="color: #666;">${b.tenant_name} • ${b.status}</span>
                        </div>
                    `).join('');
                }

            } catch (e) {
                console.error("Dashboard error", e);
            }
        });
    </script>
</body>
</html>
